name: Build daily ephemeris

on:
  schedule:
    # 16:00 UTC = 19:00 Moscow. Generate tomorrow's forecast data before the 21:00 post.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Forecast date in YYYY-MM-DD (blank = tomorrow in Moscow)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Calculate ephemeris
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: python ephemeris.py
      - name: Independent cross-check against Moshier on three dates
        run: python validate.py
      - name: Compare Uranus-Neptune centers and barycenters across ephemerides
        run: python compare_uranus_neptune_variants.py
      - name: Independent validation of exact aspects and Moon ingresses
        run: python validate_events.py
      - name: Commit daily JSON
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Update daily ephemeris"
          git push
